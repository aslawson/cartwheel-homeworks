name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Check the agent model is configured
        run: |
          if [ -z "$CARTWHEEL_MODEL" ]; then
            echo "Set the CARTWHEEL_MODEL repository variable (Settings > Secrets and variables > Actions > Variables)." >&2
            exit 1
          fi

      - name: Install Harbor
        run: |
          uv tool install 'harbor==0.23.0'
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # Each task runs five times, each attempt in a fresh Docker container.
      # The agent adapter and the judge verifiers read the provider keys from
      # the job environment above; secret values never appear in this file.
      - name: Run the evaluation cases
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # Blocks the job when a regression case fails any run. Capability cases
      # are reported but never block.
      - name: Summarize results and apply the CI gate
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5 | tee summary.md

      # One comment per pull request, updated on each push.
      - name: Comment the results on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -s summary.md ]; then cat summary.md; else echo "The Harbor job produced no summary."; fi
            echo
            echo "Commit ${GITHUB_SHA::7} · [workflow run]($RUN_URL)"
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --edit-last --create-if-none --body-file comment.md

      - name: Upload the Harbor job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          include-hidden-files: true
          if-no-files-found: warn
